server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Asset filenames carry a content hash, so they can be cached forever.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # index.html must never be cached: it is what points at the current asset hashes, so a
  # cached copy keeps serving a previous deploy's bundle after the container is replaced.
  location = /index.html {
    add_header Cache-Control "no-store, must-revalidate";
  }

  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-store, must-revalidate";
  }
}
