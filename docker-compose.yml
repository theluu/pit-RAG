services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: legal_rag
      POSTGRES_USER: legal_rag
      POSTGRES_PASSWORD: legal_rag
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legal_rag"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes: ["postgres_data:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio_data:/data"]
  clamav:
    image: clamav/clamav:stable
    volumes: ["clamav_data:/var/lib/clamav"]
  api:
    build:
      context: .
      dockerfile: deploy/docker/api.Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://legal_rag:legal_rag@postgres:5432/legal_rag
      REDIS_URL: redis://redis:6379/0
      OBJECT_STORE_ENDPOINT: minio:9000
      OBJECT_STORE_ACCESS_KEY: minioadmin
      OBJECT_STORE_SECRET_KEY: minioadmin
      CLAMAV_HOST: clamav
      MALWARE_SCAN_REQUIRED: "true"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ENABLE_OPENAI: ${ENABLE_OPENAI:-false}
      SECRET_KEY: ${SECRET_KEY:-development-only-secret-change-me-32}
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    volumes: ["api_data:/data"]
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
  worker:
    build:
      context: .
      dockerfile: deploy/docker/worker.Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://legal_rag:legal_rag@postgres:5432/legal_rag
      REDIS_URL: redis://redis:6379/0
      OBJECT_STORE_ENDPOINT: minio:9000
      OBJECT_STORE_ACCESS_KEY: minioadmin
      OBJECT_STORE_SECRET_KEY: minioadmin
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ENABLE_OPENAI: ${ENABLE_OPENAI:-false}
      OCR_ENABLED: "true"
      OCR_DPI: "300"
      OCR_LANGUAGE: vie
      OCR_MIN_CONFIDENCE: "0.8"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
  web:
    build:
      context: apps/web
      args:
        VITE_API_URL: http://localhost:8000
    ports: ["5173:80"]
    depends_on:
      api:
        condition: service_healthy
volumes:
  postgres_data:
  api_data:
  minio_data:
  clamav_data:
