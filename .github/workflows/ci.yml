name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      # The production retrieval path is pgvector SQL that SQLite cannot execute, so the
      # ANN/FTS integration tests need a real server or they silently skip.
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -e '.[dev]'
      - run: ruff check . && pytest -q
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: apps/web/package-lock.json}
      - run: npm install && npm run build
        working-directory: apps/web
